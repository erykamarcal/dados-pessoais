# Configura√ß√µes padr√£o dispon√≠veis: https://docs.spring.io/spring-boot/appendix/application-properties/index.html

spring.application.name=dados-pessoais

# --- Servidor Web ---
# server.port=8080
# server.servlet.context-path=/  # Opcional: definir um contexto base para a API

# --- Jackson (serializa√ß√£o JSON formatada) ---
spring.jackson.serialization.INDENT_OUTPUT=true

# Formata o JSON das respostas com indentaÁ„o
spring.jackson.serialization.INDENT_OUTPUT=true

# --- Banco de Dados H2 (em memÛria) ---
spring.datasource.url=jdbc:h2:mem:dadospessoais;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# --- Console Web do H2 (disponÌvel em http://localhost:8080/h2-console) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
